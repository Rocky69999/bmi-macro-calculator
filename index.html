<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI & Macro Calculator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #121314; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1c232b; border: 1px solid #2e3846; border-radius: 16px; padding: 24px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .title { font-size: 20px; font-weight: bold; color: #6ee7b7; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 12px; color: #9ca3af; margin-bottom: 6px; }
        input, select { width: 100%; padding: 10px; background: #12171d; border: 1px solid #374151; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #6ee7b7; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-calc { background: #65a30d; color: #fff; }
        .btn-calc:hover { background: #4d7c0f; }
        .btn-reset { background: transparent; border: 1px solid #4b5563; color: #fca5a5; }
        .result-box { margin-top: 20px; padding: 16px; background: #12171d; border-radius: 10px; border: 1px solid #374151; display: none; }
        .result-title { color: #6ee7b7; font-weight: bold; margin-bottom: 8px; font-size: 16px; }
        .result-item { font-size: 14px; margin: 4px 0; color: #e5e7eb; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <div class="title">BMI & Macros</div>
    </div>

    <form id="calcForm">
        <div class="form-group">
            <label>Gender / लिंग</label>
            <select id="gender">
                <option value="male">Male / पुरुष</option>
                <option value="female">Female / महिला</option>
            </select>
        </div>

        <div class="grid">
            <div class="form-group">
                <label>Age</label>
                <input type="number" id="age" value="35" required>
            </div>
            <div class="form-group">
                <label>Weight (kg)</label>
                <input type="number" id="weight" value="65" required>
            </div>
            <div class="form-group">
                <label>Height (cm)</label>
                <input type="number" id="height" value="175" required>
            </div>
        </div>

        <div class="form-group">
            <label>Goal</label>
            <select id="goal">
                <option value="gain">Weight Gain (+500 kcal)</option>
                <option value="maintain" selected>Maintain Weight</option>
                <option value="loss">Weight Loss (-500 kcal)</option>
            </select>
        </div>

        <div class="btn-group">
            <button type="button" class="btn-calc" onclick="calculateBMI()">Calculate</button>
            <button type="reset" class="btn-reset" onclick="hideResult()">Reset</button>
        </div>
    </form>

    <div id="result" class="result-box">
        <div class="result-title">Results / परिणाम</div>
        <div class="result-item" id="bmiResult">BMI: -</div>
        <div class="result-item" id="caloriesResult">Daily Calories: -</div>
        <div class="result-item" id="proteinResult">Protein: -</div>
    </div>
</div>

<script>
    function calculateBMI() {
        const weight = parseFloat(document.getElementById('weight').value);
        const height = parseFloat(document.getElementById('height').value);
        const age = parseInt(document.getElementById('age').value);
        const gender = document.getElementById('gender').value;
        const goal = document.getElementById('goal').value;

        if (!weight || !height || !age) {
            alert("कृपया सभी विवरण सही से भरें!");
            return;
        }

        // BMI Calculation
        const heightInMeters = height / 100;
        const bmi = (weight / (heightInMeters * heightInMeters)).toFixed(1);

        // BMR (Mifflin-St Jeor Equation)
        let bmr = (10 * weight) + (6.25 * height) - (5 * age);
        bmr = (gender === 'male') ? bmr + 5 : bmr - 161;

        // Total Calories (Sedentary Multiplier ~1.375)
        let tdee = bmr * 1.375;
        if (goal === 'gain') tdee += 500;
        if (goal === 'loss') tdee -= 500;

        const calories = Math.round(tdee);
        const protein = Math.round(weight * 1.8); // 1.8g per kg

        // Show Results
        document.getElementById('bmiResult').innerText = `BMI: ${bmi}`;
        document.getElementById('caloriesResult').innerText = `Daily Calories: ${calories} kcal`;
        document.getElementById('proteinResult').innerText = `Protein Target: ${protein} g/day`;
        
        document.getElementById('result').style.display = 'block';
    }

    function hideResult() {
        document.getElementById('result').style.display = 'none';
    }
</script>

</body>
</html>
